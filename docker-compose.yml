version: '3.8'
services:
  db:
    image: postgres:15
    container_name: auction_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_HOST}:${DB_PORT}:${DB_PORT}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
