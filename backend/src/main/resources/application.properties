spring.application.name=car-auction-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/auction_platform
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Katalog na zdjęcia pojazdów, względem katalogu roboczego (przy uruchamianiu z backend/ -> backend/uploads/)
app.upload-dir=uploads
